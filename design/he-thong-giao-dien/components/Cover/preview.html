<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:288px;overflow:hidden}
body{position:relative;width:960px;background:var(--nen);font-family:var(--font-sans)}
svg{position:absolute;left:0;top:0}
.navy{fill:var(--navy)} .ns{fill:var(--nhan-ns)} .kho{fill:var(--nhan-kho)} .ht{fill:var(--nhan-ht)} .tint{fill:var(--xam-nen)} .cut{fill:var(--nen)} .dem{fill:var(--vang-chu)}
.r14{rx:var(--bo-14);ry:var(--bo-14)} .r8{rx:var(--bo-8);ry:var(--bo-8)} .r10{rx:var(--bo-10);ry:var(--bo-10)}
.chu{position:absolute;left:48px;bottom:40px;max-width:420px}
.ten{margin:0;font-size:72px;line-height:.95;white-space:nowrap;font-weight:700;color:var(--muc);letter-spacing:-.01em}
.tag{margin:16px 0 0;font-size:14px;line-height:1.45;color:var(--muc-nhat)}
</style>
</head>
<body>
<!--
blocks: navy 224×208 slab (brand, Tài chính) · nhan-ns 224×96 · nhan-kho 144×128 · nhan-ht 64×64 · xam-nen 224×64 relief; sides are khoang-16/-24/-32 multiples, corners bo-14
arrangement: one tall navy slab bleeding off the top with module blocks stacked to its right, bleeding off the right edge — Tài chính as the base, three modules beside it
pattern: "geometric, modular, dense UI" row — the README is a list-and-card system (thẻ bo 14, dòng việc, số đếm), so the slab is cut by four task rows (bo-8) with count dots, echoing «Việc chờ tôi»
steps/radii: row height 24 at khoang-16 gaps, inset khoang-24; rx bo-14 blocks, bo-8 rows, bo-10 relief tiles
-->
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
  <rect class="navy r14" x="512" y="-16" width="224" height="208"/>
  <rect class="cut r8" x="536" y="24" width="152" height="24"/><circle class="dem" cx="708" cy="36" r="8"/>
  <rect class="cut r8" x="536" y="64" width="120" height="24"/><circle class="dem" cx="708" cy="76" r="8"/>
  <rect class="cut r8" x="536" y="104" width="136" height="24"/>
  <rect class="cut r8" x="536" y="144" width="96" height="24"/>
  <rect class="tint r14" x="512" y="208" width="224" height="64"/>
  <rect class="cut r10" x="528" y="224" width="88" height="32"/><rect class="cut r10" x="632" y="224" width="88" height="32"/>
  <rect class="ns r14" x="752" y="24" width="224" height="96"/>
  <rect class="kho r14" x="752" y="136" width="144" height="136"/>
  <rect class="ht r14" x="912" y="136" width="64" height="64"/>
</svg>
<div class="chu"><p class="ten">Base Vina<br>3 in 1</p><p class="tag">Một lần đăng nhập, ba phân hệ: Tài chính · Nhân sự · Kho.</p></div>
</body>
</html>
